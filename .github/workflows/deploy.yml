name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /Bordes-v2/
      # Pages no se puede habilitar desde el token de Actions en este repo,
      # así que se usa el método clásico: la rama gh-pages.
      - name: Publicar en gh-pages
        run: |
          cd dist
          git init -q
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -q -m "build ${GITHUB_SHA}"
          git push -f "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
